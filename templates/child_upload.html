<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Face Similarity Viewer | Missing Persons ID System</title>
<style>
    /* =========================================
   TWO COLOR MODERN UI - STRICT PALETTE
   #A4193D (dark/primary)
   #FFDFB9 (light/secondary)
========================================= */

:root{
    --dark:#A4193D;
    --light:#FFDFB9;
    --radius:14px;
    --shadow-sm:0 2px 8px rgba(164,25,61,0.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: fixed;
}

body{
    font-family:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:var(--light);
    color:var(--dark);
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
}

/* Tab Header */
.tab-header{
    display:flex;
    gap:10px;
    padding:12px 20px;
    background:var(--light);
    border-bottom:2px solid var(--dark);
    flex-shrink: 0;
}

.tab-btn{
    padding:8px 20px;
    border:none;
    border-radius:40px;
    background:var(--dark);
    color:var(--light);
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
}

.tab-btn.active{
    background:var(--light);
    color:var(--dark);
    border:2px solid var(--dark);
}

/* Tab Panels */
.tab-panel{
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* Container */
.container{
    display:flex;
    gap:12px;
    padding:12px;
    flex: 1;
    overflow: scroll;
}

/* LEFT PANEL - For images */
.left-pane{
    flex: 2;
    background:var(--dark);
    border-radius:20px;
    border:2px solid var(--light);
    padding:15px;
    overflow-y: auto;
    box-shadow:var(--shadow-sm);
    display: flex;
    flex-direction: column;
}

.left-pane h3 {
    color: var(--light);
    margin-bottom: 12px;
    font-size: 1rem;
    flex-shrink: 0;
}

/* Image gallery - wraps images to new rows */
.image-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-content: flex-start;
}

.image-preview-item {
    position: relative;
    width: 120px;
    height: 120px;
    border-radius: 12px;
    border: 2px solid var(--light);
    overflow: hidden;
    background: var(--light);
    flex-shrink: 0;
}

.image-preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.image-preview-item .remove-img {
    position: absolute;
    top: 4px;
    right: 4px;
    background: var(--dark);
    color: var(--light);
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}

.empty-gallery {
    color: var(--light);
    text-align: center;
    padding: 40px;
    font-size: 14px;
    opacity: 0.8;
    width: 100%;
}

/* RIGHT PANEL - Compact form */
.right-pane{
    flex: 1;
    max-width: 380px;
    background:var(--dark);
    border-radius:20px;
    border:2px solid var(--light);
    overflow-y: auto;
    padding:15px;
    box-shadow:var(--shadow-sm);
}

.right-pane::-webkit-scrollbar{
    width: 4px;
}

.right-pane::-webkit-scrollbar-thumb{
    background: var(--light);
    border-radius: 999px;
}

/* Compact Form Styling */
.missing-person-form {
    background: var(--light);
    border-radius: 16px;
    padding: 12px;
    border: 2px solid var(--dark);
}

.form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.form-group {
    margin-bottom: 10px;
    flex: 1;
}

label {
    color: var(--dark);
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 3px;
    display: block;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

input[type="text"],
input[type="number"],
input[type="date"],
input[type="file"],
input[type="tel"],
input[type="textarea"],
textarea,
select {
    width: 100%;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1.5px solid var(--dark);
    background: var(--light);
    color: var(--dark);
    font-size: 12px;
    outline: none;
}

textarea {
    min-height: 50px;
    resize: vertical;
}

button {
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    background: var(--dark);
    color: var(--light);
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
}

.section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--dark);
    margin: 12px 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 1.5px solid var(--dark);
}

/* Mark Entry */
.mark-entry {
    background: var(--light);
    border: 1.5px solid var(--dark);
    border-radius: 10px;
    padding: 6px;
    margin-bottom: 6px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
}

.mark-entry select, .mark-entry input {
    flex: 1;
    min-width: 80px;
    padding: 4px 6px;
    font-size: 11px;
}

.remove-mark {
    background: var(--dark) !important;
    padding: 4px 10px;
    font-size: 10px;
}

/* ID DEAD TAB - ORIGINAL STYLES - UNCHANGED */
#dead .left-pane {
    width: 320px;
    min-width: 320px;
    flex: none;
}

#dead .image-block {
    position: relative;
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 18px;
    background: var(--light);
    border: 2px solid var(--dark);
    transition: 0.2s ease;
    cursor: pointer;
}

#dead .image-block:hover {
    transform: translateY(-2px);
}

#dead .image-block input[type="checkbox"] {
    position: absolute;
    top: 12px;
    left: 12px;
    transform: scale(1.1);
    accent-color: var(--dark);
    z-index: 2;
}

#dead .image-block img {
    width: 100%;
    display: block;
    border-radius: 14px;
    object-fit: cover;
}

#dead .similarity {
    margin-top: 8px;
    padding: 8px;
    border-radius: 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    background: var(--dark);
    color: #FFDFB9;
}

#dead .similarity span {
    font-size: 14px;
    font-weight: 900;
}

#dead .preview-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--light);
    border-radius: 20px;
    border: 2px solid var(--dark);
    margin: 0 12px;
    padding: 10px;
}

#dead .preview-container img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 16px;
    object-fit: contain;
}

#dead .filter-form {
    background: var(--light);
    border-radius: 16px;
    padding: 12px;
    border: 2px solid var(--dark);
}

#dead input[type="range"] {
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: var(--dark);
    outline: none;
    margin: 6px 0;
}

#dead input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--light);
    border: 2px solid var(--dark);
    cursor: pointer;
}

#dead h3 {
    font-size: 0.9rem;
    margin-bottom: 8px;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 4px;
    height: 4px;
}

::-webkit-scrollbar-track {
    background: var(--light);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb {
    background: var(--dark);
    border-radius: 10px;
}

small {
    font-size: 9px;
}
#tableWrapper{
    overflow-y:auto;
    background:var(--light);
    border-radius:16px;
    padding:12px;
    border:2px solid var(--dark);
}
.confirmed-th{
    background:var(--dark);
    color:var(--light);
    padding:12px;
    border:1px solid var(--dark);
}
</style>
</head>
<body>

<!-- TAB HEADER -->
<div class="tab-header">
    <h1>Child Begging Witness Portal</h1>
</div>

<!-- TAB 1: ADD MISSING PERSON -->
<div class="tab-panel" id="missing">
    <div class="container">
        <!-- LEFT PANEL: Image Gallery -->
        <div class="left-pane">
            <h3>📸 Uploaded Images <span id="imageCount" style="font-size: 12px; opacity: 0.8;"></span></h3>
            <div id="imageGallery" class="image-gallery">
                <div class="empty-gallery">No images selected yet<br>Click "Choose Files" to add photos</div>
            </div>
        </div>

        <!-- RIGHT PANEL: Compact Form -->
        <div class="right-pane">
            <h3 style="font-size: 1rem; color: var(--light); margin-bottom: 10px;">📝 Enter Your Details</h3>
            <form method="POST" action="/submit_child_witness" enctype="multipart/form-data" class="missing-person-form" id="missingPersonForm">
                <div class="form-group">
                    <label>🖼️ Upload Evidence Photos</label>
                    <input type="file" name="child_images" accept="image/*" multiple onchange="previewMultipleImages(event)" required>
                    <small>Select multiple images for better accuracy</small>
                </div>

                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" name="name" placeholder="Full name" required>
                </div>

                <div class="form-group">
                    <label>📞 Phone Number ( without Country Code )</label>
                    <input type="tel" 
                        id="phone" 
                        name="phone"
                        placeholder="Phone number"
                        pattern="[0-9]{10}" 
                        required>
                </div>

                <div class="form-group">
                    <label>🏠 Address</label>
                    <textarea name="address"
                        placeholder="House name, street, locality, district, state..."
                        required></textarea>
                </div>

                <div class="form-group">
                    <label>📝 Description of Witnessed Event</label>
                    <textarea name="event_description"
                        placeholder="Describe what happened, where the child was last seen, suspicious activity, vehicle details, clothing, time, witnesses, etc..."
                        required></textarea>
                </div>

                <div class="section-title">📍 LAST SEEN LOCATION</div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" name="last_state" placeholder="State" required>
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" name="last_city" placeholder="City" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Area/Landmark</label>
                        <input type="text" name="last_area" placeholder="Area">
                    </div>
                    <div class="form-group">
                        <label>Last Seen Date</label>
                        <input type="date" name="last_seen_date" required>
                    </div>
                </div>

                <button type="submit" style="width: 100%; margin-top: 8px;">💾 Submit Details</button>
                <input type="hidden" name="form_type" value="add_missing">
            </form>
        </div>
    </div>
</div>

<script>
    let uploadedImages = [];

    function previewMultipleImages(event) {
        const gallery = document.getElementById('imageGallery');
        const files = Array.from(event.target.files);
        uploadedImages = files;
        
        gallery.innerHTML = '';
        
        if (files.length === 0) {
            gallery.innerHTML = '<div class="empty-gallery">No images selected yet<br>Click "Choose Files" to add photos</div>';
            document.getElementById('imageCount').textContent = '';
            return;
        }
        
        document.getElementById('imageCount').textContent = `(${files.length})`;
        
        files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const div = document.createElement('div');
                div.className = 'image-preview-item';
                div.innerHTML = `
                    <img src="${e.target.result}" alt="Preview ${index + 1}">
                    <button type="button" class="remove-img" onclick="removeImage(${index})">✕</button>
                `;
                gallery.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
    }

    function removeImage(index) {
        uploadedImages.splice(index, 1);
        const fileInput = document.querySelector('input[name="person_images"]');
        const dt = new DataTransfer();
        uploadedImages.forEach(file => dt.items.add(file));
        fileInput.files = dt.files;
        previewMultipleImages({ target: fileInput });
    }
</script>
</body>
</html>
